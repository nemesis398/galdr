# The manifests, ShellCheck and the hook tests, the Markdown, and no em dash.
name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate the marketplace and each plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.326 plugin validate .claude-plugin/marketplace.json
          for p in plugins/*/; do
            [ -d "$p" ] && npx --yes @anthropic-ai/claude-code@2.1.326 plugin validate "$p"
          done

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck the scripts
        run: |
          find . -path ./.git -prune -o -name '*.sh' -print0 | xargs -0 -r shellcheck
      # The prune test needs unprivileged user namespaces, which Ubuntu 24.04 restricts.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Every test file runs, and the step fails after the last one if any
      # failed, so one red file does not hide the others.
      - name: Run the hook tests
        run: |
          failed=()
          for t in plugins/*/*/tests/*.test.sh; do
            [ -f "$t" ] || continue
            bash "$t" || failed+=("$t")
          done
          if ((${#failed[@]})); then
            printf '::error::failed: %s\n' "${failed[@]}"
            exit 1
          fi

  # The hook tests on an Intel Mac: BSD stat, date and find, no setsid, flock
  # or timeout, and no GNU coreutils, so the ports are tested without the
  # g-prefixed tools. Homebrew's bash runs them, as on a user's Mac.
  shell-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bash and jq
        run: brew install bash jq
      - name: Run the hook tests under Homebrew bash
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          bash --version | head -n1
          # The hook tests only: statusline.test.sh reads /proc and calls
          # date -d, so it runs on Linux alone.
          # Every test file runs, and the step fails after the last one if
          # any failed, so one red file does not hide the others.
          failed=()
          for t in plugins/galdr/hooks/tests/*.test.sh; do
            [ -f "$t" ] || continue
            bash "$t" || failed+=("$t")
          done
          if ((${#failed[@]})); then
            printf '::error::failed: %s\n' "${failed[@]}"
            exit 1
          fi

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  em-dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No em dash
        run: |
          if grep -rnF --exclude-dir=.git "$(printf '\342\200\224')" .; then
            echo "em dash found: use a comma, a colon, parentheses or two sentences" >&2
            exit 1
          fi
